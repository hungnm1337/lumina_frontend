<div class="space-y-1.5">
  @for (option of options; track option.optionId; let optionIndex = $index) {
  <button
    type="button"
    (click)="onSelect(option)"
    [disabled]="disabled"
    [attr.aria-pressed]="selectedOption?.optionId === option.optionId"
    [class]="
      selectedOption?.optionId === option.optionId
        ? 'w-full px-3 py-2 text-left rounded-lg border-2 transition-all duration-200 bg-blue-50 border-blue-500 text-blue-900 font-semibold text-sm'
        : 'w-full px-3 py-2 text-left rounded-lg border-2 border-gray-200 hover:border-blue-400 hover:bg-blue-50 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed text-sm'
    "
  >
    @if (showAnswerLetters) {
    <span class="listening-option-letter" aria-hidden="true">
      {{ 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[optionIndex] }}
    </span>
    }
    <div class="listening-option-content">
      <span>{{ option.content }}</span>
    </div>
  </button>
  }
</div>
