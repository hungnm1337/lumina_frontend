<!DOCTYPE html>
<html><head>
  <meta charset="utf-8">
  <meta name="kombai-design-canvas" content="true">
  
  
  
  <script src="https://unpkg.com/@tailwindcss/browser@4.3.3/dist/index.global.js" integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB" crossorigin="anonymous"></script>
  
  <style>html, body { margin: 0; padding: 0; } #root { display: contents; }</style>
</head><body>
  <div id="root"><style>
  @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css');

  .reading-screen {
    min-height: 100vh;
    background: #ffffff;
    color: #1a1a1a;
    font-family: Arial, Helvetica, sans-serif;
    padding-bottom: 95px;
  }

  .reading-content {
    width: min(600px, calc(100% - 64px));
    margin: 0 auto;
    padding: 55px 0 70px;
  }

  .reading-title {
    margin: 0 0 30px;
    font-size: 30px;
    line-height: 1.25;
    font-weight: 400;
  }

  .reading-subtitle {
    margin: 0 0 24px;
    font-size: 20px;
    line-height: 1.2;
    font-weight: 700;
  }

  .reading-copy {
    margin: 0;
    font-size: 20px;
    line-height: 1.35;
  }

  .reading-copy + .reading-copy {
    margin-top: 18px;
  }

  .reading-note {
    margin: 62px 0 0;
    font-size: 20px;
    line-height: 1.35;
  }

  .reading-toolbar {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 5;
    display: flex;
    min-height: 94px;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border: 1px solid #e4e1ed;
    background: #ffffff;
    box-shadow: 0 -7px 18px rgba(36, 0, 95, 0.14);
  }

  .reading-toolbar-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .reading-icon-button,
  .reading-next-button {
    display: inline-flex;
    flex-shrink: 0;
    min-height: 46px;
    align-items: center;
    justify-content: center;
    border: 1px solid #b9b9b9;
    border-radius: 5px;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    cursor: pointer;
  }

  .reading-icon-button {
    width: 46px;
    height: 46px;
    min-height: 46px;
    color: #151515;
    font-size: 18px;
  }

  .reading-next-button {
    min-width: 135px;
    gap: 15px;
    padding: 0 20px;
    border-color: #25005f;
    color: #ffffff;
    background: #25005f;
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
  }

  .reading-icon-button:hover,
  .reading-next-button:hover {
    filter: brightness(0.96);
  }

  .reading-icon-button:focus-visible,
  .reading-next-button:focus-visible {
    outline: 3px solid #b9a2d9;
    outline-offset: 3px;
  }

  @media (max-width: 700px) {
    .reading-content {
      width: min(600px, calc(100% - 36px));
      padding-top: 38px;
    }

    .reading-copy,
    .reading-note {
      font-size: 17px;
    }

    .reading-toolbar {
      min-height: 82px;
      padding: 9px;
    }

    .reading-toolbar-group {
      gap: 6px;
    }

    .reading-icon-button {
      width: 42px;
      height: 42px;
      min-height: 42px;
    }

    .reading-next-button {
      min-width: 102px;
      min-height: 42px;
      gap: 8px;
      padding: 0 13px;
    }
  }
</style>

<div class="reading-screen" data-kid="1" data-name="page layout container">
  <main aria-labelledby="reading-instructions-title" class="reading-content" data-kid="1-1" data-name="instructions content section">
    <h1 class="reading-title" data-kid="1-1-1" data-name="instructions heading" id="reading-instructions-title">Aptis General Reading Instructions</h1>
    <h2 class="reading-subtitle" data-kid="1-1-2" data-name="reading section subheading">Reading</h2>
    <p class="reading-copy" data-kid="1-1-3" data-name="first instruction paragraph">The test has five parts.</p>
    <p class="reading-copy" data-kid="1-1-4" data-name="second instruction paragraph">You have 35 minutes to complete the test.</p>
    <p class="reading-note" data-kid="1-1-5" data-name="next step note paragraph">When you click on the 'Next' button, the test will begin.</p>
  </main>

  <footer aria-label="Test navigation" class="reading-toolbar" data-kid="1-2" data-name="footer navigation bar">
    <div class="reading-toolbar-group" data-kid="1-2-1" data-name="left utility buttons group">
      <button aria-label="Question list" class="reading-icon-button" data-kid="1-2-1-1" data-name="question list button" title="Question list" type="button">
        <i aria-hidden="true" class="fa-solid fa-list" data-kid="1-2-1-1-1" data-name="list icon"></i>
      </button>
      <button aria-label="Information" class="reading-icon-button" data-kid="1-2-1-2" data-name="information button" title="Information" type="button">
        <i aria-hidden="true" class="fa-solid fa-circle-info" data-kid="1-2-1-2-1" data-name="info icon"></i>
      </button>
      <button aria-label="Accessibility" class="reading-icon-button" data-kid="1-2-1-3" data-name="accessibility button" title="Accessibility" type="button">
        <i aria-hidden="true" class="fa-solid fa-person" data-kid="1-2-1-3-1" data-name="person icon"></i>
      </button>
    </div>
    <div class="reading-toolbar-group" data-kid="1-2-2" data-name="right action buttons group">
      <button aria-label="Exit test" class="reading-icon-button" data-kid="1-2-2-1" data-name="exit test button" title="Exit test" type="button">
        <i aria-hidden="true" class="fa-solid fa-right-from-bracket" data-kid="1-2-2-1-1" data-name="right from bracket icon"></i>
      </button>
      <button aria-label="Next" class="reading-next-button" data-kid="1-2-2-2" data-name="next button" title="Next" type="button">
        <span data-kid="1-2-2-2-1" data-name="next label text">Next</span>
        <i aria-hidden="true" class="fa-solid fa-arrow-right" data-kid="1-2-2-2-2" data-name="right arrow icon"></i>
      </button>
    </div>
  </footer>
</div></div>
</body></html>
